<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>404 - Page Not Found | Stackly Municipal Services</title>
  <meta name="description" content="The municipal page or service you are trying to access is not currently mapped. Return to Stackly Municipal Services.">
  
  <!-- Favicon -->
  <link rel="icon" type="image/png" href="images/stackly-logo-orange.png">

  <!-- Fonts: Plus Jakarta Sans & Space Grotesk -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800;900&family=Space+Grotesk:wght@600;700;800&display=swap" rel="stylesheet">
  
  <!-- FontAwesome 6 Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  
  <!-- Core Municipal Services Stylesheet -->
  <link rel="stylesheet" href="css/style.css">

  <style>
    /* ==========================================================================
       404 ERROR PAGE - MUNICIPAL SERVICES THEME
       Clean, Focused Layout with ONLY "Go Back" and "Back to Home" Buttons
       ========================================================================== */
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      width: 100%;
      height: 100%;
      background-color: #ffffff;
      color: #0a0a0a;
      font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      overflow-x: hidden;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    body {
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      position: relative;
      background: radial-gradient(circle at 50% 36%, rgba(255, 102, 0, 0.08) 0%, rgba(255, 255, 255, 0.98) 58%), #ffffff;
      padding: 30px 20px;
    }

    /* Ambient Municipal Blueprint Grid Pattern */
    body::before {
      content: '';
      position: absolute;
      inset: 0;
      background-image: 
        linear-gradient(to right, rgba(0, 0, 0, 0.035) 1px, transparent 1px),
        linear-gradient(to bottom, rgba(0, 0, 0, 0.035) 1px, transparent 1px);
      background-size: 44px 44px;
      pointer-events: none;
      z-index: 0;
    }

    .error-wrapper {
      position: relative;
      z-index: 2;
      width: 100%;
      max-width: 780px;
      margin: auto;
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    /* Diagnostic Pill Badge */
    .diagnostic-tag {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 6px 18px;
      border-radius: 9999px;
      background: rgba(255, 102, 0, 0.09);
      color: var(--brand-orange);
      border: 1px solid rgba(255, 102, 0, 0.28);
      font-size: 0.82rem;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.6px;
      margin-bottom: 16px;
      user-select: none;
    }

    /* Sliced 404 SVG Stage */
    .artwork-404-box {
      width: 100%;
      max-width: 500px;
      margin: 0 auto 8px;
      display: flex;
      justify-content: center;
      align-items: center;
      position: relative;
      user-select: none;
    }

    .artwork-404-svg {
      width: 100%;
      height: auto;
      max-height: 230px;
      overflow: visible;
      filter: drop-shadow(0 14px 28px rgba(255, 102, 0, 0.2)) drop-shadow(0 4px 10px rgba(10, 10, 10, 0.06));
    }

    /* Radar Pulse Ring around center '0' */
    .radar-orbit-ring {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 160px;
      height: 160px;
      border: 2px dashed rgba(255, 102, 0, 0.35);
      border-radius: 50%;
      pointer-events: none;
      animation: radarSpin 12s linear infinite;
    }

    @keyframes radarSpin {
      0% { transform: translate(-50%, -50%) rotate(0deg); }
      100% { transform: translate(-50%, -50%) rotate(360deg); }
    }

    /* Headline & Subtitle */
    .error-title-main {
      font-family: 'Space Grotesk', var(--font-display), sans-serif;
      font-size: clamp(2.1rem, 4.6vw, 3rem);
      font-weight: 800;
      color: #0a0a0a;
      letter-spacing: -0.025em;
      line-height: 1.2;
      margin-top: 14px;
      margin-bottom: 12px;
    }

    .error-subtitle-main {
      font-size: clamp(1rem, 1.8vw, 1.12rem);
      font-weight: 400;
      color: var(--text-muted);
      line-height: 1.6;
      max-width: 560px;
      margin: 0 auto 32px;
    }

    /* Action Buttons (ONLY "Go Back" and "Back to Home") */
    .buttons-action-row {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 16px;
      flex-wrap: wrap;
    }

    /* 1. Go Back Button (Dark Charcoal Pill) */
    .btn-action-back {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      background: #1e293b;
      color: #ffffff;
      border: none;
      border-radius: 9999px;
      padding: 14px 34px;
      font-size: 1.02rem;
      font-weight: 700;
      font-family: inherit;
      cursor: pointer;
      box-shadow: 0 4px 14px rgba(30, 41, 59, 0.2);
      transition: background 0.2s ease, transform 0.2s ease, box-shadow 0.2s ease;
      min-width: 145px;
    }

    .btn-action-back:hover {
      background: #0f172a;
      transform: translateY(-2px);
      box-shadow: 0 8px 22px rgba(30, 41, 59, 0.32);
    }

    .btn-action-back:active {
      transform: translateY(0);
    }

    /* 2. Back to Home Button (Glowing Municipal Orange Pill) */
    .btn-action-home {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      background: var(--brand-orange);
      color: #ffffff;
      text-decoration: none;
      border: none;
      border-radius: 9999px;
      padding: 14px 38px;
      font-size: 1.02rem;
      font-weight: 700;
      font-family: inherit;
      cursor: pointer;
      box-shadow: 0 8px 25px rgba(255, 102, 0, 0.4);
      transition: background 0.2s ease, transform 0.2s ease, box-shadow 0.2s ease;
      min-width: 170px;
    }

    .btn-action-home:hover {
      background: var(--brand-orange-hover);
      transform: translateY(-2px);
      box-shadow: 0 12px 32px rgba(255, 102, 0, 0.55);
    }

    .btn-action-home:active {
      transform: translateY(0);
    }

    .btn-action-back:focus-visible,
    .btn-action-home:focus-visible {
      outline: 2px solid var(--brand-orange);
      outline-offset: 3px;
    }

    @media (max-width: 540px) {
      .artwork-404-box {
        max-width: 330px;
      }
      .buttons-action-row {
        width: 100%;
        gap: 12px;
      }
      .btn-action-back,
      .btn-action-home {
        flex: 1;
        padding: 13px 20px;
        font-size: 0.95rem;
      }
    }
  </style>
</head>
<body>

  <!-- Central 404 Container -->
  <main class="error-wrapper">

    <!-- Diagnostic Tag -->
    <div class="diagnostic-tag">
      <i class="fa-solid fa-satellite-dish"></i> Status 404: Municipal Route Not Found
    </div>

    <!-- Sliced 404 Graphic (Municipal Orange + Crisp Ivory Slice + Radar Orbit) -->
    <div class="artwork-404-box" aria-hidden="true">
      <div class="radar-orbit-ring"></div>
      <svg class="artwork-404-svg" viewBox="0 0 540 220" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <!-- Sliced 3-Section Gradient: Municipal Orange -> Ivory White -> Municipal Orange -->
          <linearGradient id="muniSlicedOrangeGrad" x1="0" y1="0" x2="0" y2="100%">
            <stop offset="0%" stop-color="#ff6600" />
            <stop offset="41%" stop-color="#ff6600" />
            <stop offset="41%" stop-color="#ffffff" />
            <stop offset="58%" stop-color="#ffffff" />
            <stop offset="58%" stop-color="#ff6600" />
            <stop offset="100%" stop-color="#ff6600" />
          </linearGradient>

          <!-- Subtle Municipal Glow Filter -->
          <filter id="muniGlow" x="-20%" y="-20%" width="140%" height="140%">
            <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="rgba(255, 102, 0, 0.28)" />
            <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="rgba(15, 23, 42, 0.08)" />
          </filter>
        </defs>

        <!-- Main Sliced 404 with white border and sliced gradient -->
        <text x="270" y="160"
              text-anchor="middle"
              font-family="'Plus Jakarta Sans', 'Space Grotesk', system-ui, sans-serif"
              font-weight="900"
              font-size="196"
              letter-spacing="6"
              fill="url(#muniSlicedOrangeGrad)"
              stroke="#ffffff"
              stroke-width="5"
              stroke-linejoin="round"
              paint-order="stroke fill"
              filter="url(#muniGlow)">
          404
        </text>
      </svg>
    </div>

    <!-- Headline & Description -->
    <h1 class="error-title-main">
      This page <span class="highlight">wandered off-canvas.</span>
    </h1>
    <p class="error-subtitle-main">
      The link you followed might be broken, or the municipal service may have been relocated. Let's get you back on track.
    </p>

    <!-- ONLY Go Back and Back to Home Buttons -->
    <div class="buttons-action-row">
      <button type="button" id="goBackBtn" class="btn-action-back" onclick="navigateBack()" aria-label="Return to previous page" style="cursor: pointer;">
        <i class="fa-solid fa-arrow-left"></i> Go Back
      </button>
      <a href="index.html" class="btn-action-home" aria-label="Return to Stackly Homepage" style="cursor: pointer;">
        <i class="fa-solid fa-house"></i> Back to Home
      </a>
    </div>

  </main>

  <script>
    // Bulletproof Navigation back to the exact previous page the user was visiting
    function navigateBack() {
      const current = window.location.href;

      // 1. Priority: URL query param '?from=...'
      try {
        const urlParams = new URLSearchParams(window.location.search);
        const fromParam = urlParams.get('from');
        if (fromParam && !fromParam.includes('404')) {
          window.location.href = decodeURIComponent(fromParam);
          return;
        }
      } catch (e) {}

      // 2. Priority: document.referrer if it's from this site/origin and not a 404 page
      try {
        const ref = document.referrer;
        if (ref && !ref.includes('404') && ref !== current && (ref.startsWith(window.location.origin) || ref.startsWith('file:///'))) {
          window.location.href = ref;
          return;
        }
      } catch (e) {}

      // 3. Priority: sessionStorage recorded last visited page URL
      try {
        const sessionPage = sessionStorage.getItem('stackly_last_page');
        if (sessionPage && !sessionPage.includes('404') && sessionPage !== current) {
          window.location.href = sessionPage;
          return;
        }
      } catch (e) {}

      // 4. Priority: sessionStorage recorded last visited filename
      try {
        const sessionFile = sessionStorage.getItem('stackly_last_filename');
        if (sessionFile && !sessionFile.includes('404')) {
          window.location.href = sessionFile;
          return;
        }
      } catch (e) {}

      // 5. Priority: localStorage recorded last visited page URL
      try {
        const localPage = localStorage.getItem('stackly_last_page');
        if (localPage && !localPage.includes('404') && localPage !== current) {
          window.location.href = localPage;
          return;
        }
      } catch (e) {}

      // 6. Priority: localStorage recorded last visited filename
      try {
        const localFile = localStorage.getItem('stackly_last_filename');
        if (localFile && !localFile.includes('404')) {
          window.location.href = localFile;
          return;
        }
      } catch (e) {}

      // 7. Priority: Browser history back
      if (window.history.length > 1) {
        window.history.back();
        setTimeout(() => {
          if (window.location.href === current) {
            window.location.href = 'index.html';
          }
        }, 300);
        return;
      }

      // 8. Safe fallback to index
      window.location.href = 'index.html';
    }

    // Attach explicit click and touch listeners to Go Back button
    document.addEventListener('DOMContentLoaded', () => {
      const backBtn = document.getElementById('goBackBtn') || document.querySelector('.btn-action-back');
      if (backBtn) {
        backBtn.addEventListener('click', (e) => {
          e.preventDefault();
          navigateBack();
        });
      }
    });

    // Keyboard navigation: Escape key triggers Go Back
    window.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') navigateBack();
    });
  </script>
</body>
</html>
